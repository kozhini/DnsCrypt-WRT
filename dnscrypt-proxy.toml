##############################################
#  dnscrypt-proxy 2.1.18                     #
#  GL.iNet GL-MT6000 (OpenWrt)               #
#  Анонимность + DPI/цензура                 #
##############################################

###############################################################################
#                             Global settings                                  #
###############################################################################

server_names = [
  # ODoH — максимальная анонимность (no logs, no filter)
  'odoh-crypto-sx',
  'odoh-cloudflare',
  'odoh-snowstorm',
  
  # dnscry.pt ODoH — географическое разнообразие
  'dnscry.pt-odoh-zurich',
  'dnscry.pt-odoh-amsterdam',
  'dnscry.pt-odoh-stockholm',
  'dnscry.pt-odoh-singapore',
  'dnscry.pt-odoh-hongkong',
  
  # DNSCrypt fallback (no logs, no filter)
  'dnscry.pt-amsterdam-ipv4',
  'dnscry.pt-frankfurt-ipv4',
  'scaleway-fr'
]

listen_addresses = ['127.0.0.10:53']
max_clients = 250

###############################################################################
#                            Server Selection                                  #
###############################################################################

ipv4_servers = true
ipv6_servers = false

dnscrypt_servers = true
doh_servers = true
odoh_servers = true

require_dnssec = false
require_nolog = true
require_nofilter = true
disabled_server_names = []

###############################################################################
#                           Connection Settings                                #
###############################################################################

## Если DPI/провайдер блокирует UDP — раскомментируйте:
# force_tcp = true
# proxy = 'socks5://127.0.0.1:9050'

force_tcp = false

## HTTP/3 (QUIC) — усложняет DPI-анализ, трафик похож на обычный Google/Cloudflare
http3 = true
## Не пробовать HTTP/3 для серверов без Alt-Svc (избегаем таймаутов)
http3_probe = false

timeout = 8000
keepalive = 30

## EDNS Client Subnet — НЕ ТРОГАТЬ. 
## Раскомментирование этой опции сломает анонимность, передав резолверу вашу подсеть.
# edns_client_subnet = ['0.0.0.0/0', '2001:db8::/32']

###############################################################################
#                        Load Balancing & Performance                          #
###############################################################################

lb_strategy = 'wp2'
lb_estimator = true

###############################################################################
#                                Logging                                       #
###############################################################################

log_level = 2

## В OpenWrt пишем ТОЛЬКО в syslog (logread). 
## Лог-файл закомментирован, чтобы не убивать flash/RAM.
# log_file = '/var/log/dnscrypt-proxy.log'

use_syslog = true

log_files_max_size = 10
log_files_max_age = 7
log_files_max_backups = 1

###############################################################################
#                           Certificate Management                             #
###############################################################################

cert_refresh_delay = 240
cert_ignore_timestamp = false

## Новый ключ для каждого DNSCrypt-запроса (нагрузка на CPU приемлема для MT7986A)
dnscrypt_ephemeral_keys = true

## Отключаем TLS session tickets — предотвращает корреляцию сессий по ticket
tls_disable_session_tickets = true

###############################################################################
#                            Startup & Network                                 #
###############################################################################

bootstrap_resolvers = [
  '1.1.1.1:53',
  '9.9.9.9:53',
  '149.112.112.112:53'
]

ignore_system_dns = true

## 60 сек достаточно для OpenWrt; 120 слишком долго при переподключении WAN
netprobe_timeout = 60
netprobe_address = '9.9.9.9:53'

###############################################################################
#                                 Filters                                      #
###############################################################################

block_ipv6 = false
block_unqualified = true
block_undelegated = true
reject_ttl = 10

## Если бы включали блокировку — возвращать REFUSED вместо HINFO (ломает меньше клиентов)
blocked_query_response = 'refused'

###############################################################################
#                                DNS Cache                                     #
###############################################################################

cache = true
cache_size = 8192
cache_min_ttl = 3600
cache_max_ttl = 172800
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

###############################################################################
#                                 Servers                                      #
###############################################################################

[sources]

[sources.'public-resolvers']
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
  'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
  'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md',
]
cache_file = 'public-resolvers.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

[sources.'relays']
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md',
  'https://download.dnscrypt.info/resolvers-list/v3/relays.md',
  'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/relays.md',
]
cache_file = 'relays.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

[sources.'odoh-servers']
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-servers.md',
  'https://download.dnscrypt.info/resolvers-list/v3/odoh-servers.md',
  'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-servers.md',
]
cache_file = 'odoh-servers.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

[sources.'odoh-relays']
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-relays.md',
  'https://download.dnscrypt.info/resolvers-list/v3/odoh-relays.md',
  'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-relays.md',
]
cache_file = 'odoh-relays.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

###############################################################################
#                          Anonymized DNS                                      #
###############################################################################

[anonymized_dns]

## ODoH relay НЕ могут использоваться с DNSCrypt-серверами.
## DNSCrypt relay НЕ могут использоваться с ODoH-серверами.
## Разделяем маршруты по протоколам.

routes = [
  # ODoH через оба relay (round-robin приоритет)
  { server_name='odoh-cloudflare', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
  { server_name='odoh-crypto-sx', via=['odohrelay-numa', 'odohrelay-crypto-sx'] },
  { server_name='odoh-snowstorm', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
  
  # dnscry.pt ODoH
  { server_name='dnscry.pt-odoh-zurich', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
  { server_name='dnscry.pt-odoh-amsterdam', via=['odohrelay-numa', 'odohrelay-crypto-sx'] },
  { server_name='dnscry.pt-odoh-stockholm', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
  { server_name='dnscry.pt-odoh-singapore', via=['odohrelay-numa', 'odohrelay-crypto-sx'] },
  { server_name='dnscry.pt-odoh-hongkong', via=['odohrelay-crypto-sx', 'odohrelay-numa'] },
  
  # DNSCrypt через anonymized relay (географически близкие)
  { server_name='dnscry.pt-amsterdam-ipv4', via=['anon-cs-nl', 'anon-cs-de'] },
  { server_name='dnscry.pt-frankfurt-ipv4', via=['anon-cs-de', 'anon-cs-ch'] },
  { server_name='scaleway-fr', via=['anon-scaleway', 'anon-cs-fr'] },
  
  # Fallback (неактивен при явном server_names, но оставлен для совместимости)
  { server_name='*', via=['*'] }
]

skip_incompatible = true

###############################################################################
#                        Servers with known bugs                               #
###############################################################################

[broken_implementations]

fragments_blocked = [
  'cisco',
  'cisco-ipv6',
  'cisco-familyshield',
  'cisco-familyshield-ipv6',
  'cisco-sandbox',
  'cleanbrowsing-adult',
  'cleanbrowsing-adult-ipv6',
  'cleanbrowsing-family',
  'cleanbrowsing-family-ipv6',
  'cleanbrowsing-security',
  'cleanbrowsing-security-ipv6',
]
